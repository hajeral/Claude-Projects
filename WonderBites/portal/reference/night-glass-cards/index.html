<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WonderBites — Night Glass cards (EN / العربية)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   Midnight Plum tokens (from concept-4), RTL card styles A & B
   RULE: no transitions / animations on cards or chrome. Only charts
   animate once (class .anim on a board), reduced-motion respected.
   ================================================================ */
:root{
  --night:#1A0F1E; --deep:#3A2343; --plum:#583D62; --mauve:#B783A7;
  --rose:#C65C75; --berry:#A50B5E; --berry2:#B34F73;
  --g-deep:#0C432E; --g-mid:#2D6F3F; --g-bright:#11A849; --lime:#B7EF76; --orange:#E87C40;
  --wm:'Playfair Display', Georgia, serif;
}
/* language: fonts (Latin = Playfair + Inter; Arabic = Noto Naskh + IBM Plex Sans Arabic) */
html[lang="en"]{--ui:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --disp:'Playfair Display', Georgia, serif; --num:'Inter', system-ui, sans-serif; --lh:1.45; --dir:ltr}
html[lang="ar"]{--ui:'IBM Plex Sans Arabic', 'Noto Sans Arabic', Tahoma, sans-serif; --disp:'Noto Naskh Arabic', 'IBM Plex Sans Arabic', serif; --num:'Noto Naskh Arabic', 'IBM Plex Sans Arabic', serif; --lh:1.6; --dir:rtl}
/* direction-aware decoration (gradients/glows that run from the start side) */
html[dir="ltr"]{--g-start:90deg; --g-act:135deg; --g-ban:100deg; --sx:3px; --s-x:0%; --e-x:100%}
html[dir="rtl"]{--g-start:270deg; --g-act:225deg; --g-ban:260deg; --sx:-3px; --s-x:100%; --e-x:0%}
.alt{text-align:match-parent}
.alt:lang(ar){font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}
.alt:lang(en){font-family:'Inter',system-ui,sans-serif}
html[data-theme="dark"]{
  --bg:#1E1223; --bg-glow1:rgba(198,92,117,.16); --bg-glow2:rgba(88,61,98,.45);
  --side:#140A17; --side-line:rgba(183,131,167,.14);
  --card:#2A1A30; --card-2:#352240; --card-3:#3A2343;
  --line:rgba(183,131,167,.17); --line-2:rgba(183,131,167,.28);
  --text:#F7F3EE; --muted:#CDBBC7; --faint:#A8919F;
  --accent:#EC8AA1; --accent-strong:#B34F73;
  --pos:#B7EF76; --neg:#F59AAE; --warn:#FFAE7A;
  --glass:rgba(30,18,35,.62); --glass-line:rgba(183,131,167,.18);
  --grid:rgba(183,131,167,.13);
  --pill-g-bg:rgba(17,168,73,.16); --pill-g:#9BE8A9;
  --pill-o-bg:rgba(232,124,64,.17); --pill-o:#FFB88A;
  --pill-r-bg:rgba(198,92,117,.2);  --pill-r:#F7A3B6;
  --pill-n-bg:rgba(247,243,238,.08); --pill-n:#C6B5C0;
  --pill-m-bg:rgba(183,131,167,.2); --pill-m:#E3BEDA;
  --tint-rose:rgba(198,92,117,.18); --tint-green:rgba(17,168,73,.16); --tint-orange:rgba(232,124,64,.17); --tint-mauve:rgba(183,131,167,.18); --tint-berry:rgba(165,11,94,.28);
  --ic-rose:#F49AB0; --ic-green:#9BE8A9; --ic-orange:#FFB88A; --ic-mauve:#E3BEDA; --ic-berry:#F58CC0;
  --row-hover:rgba(183,131,167,.07);
  --page:#120A15; --page-text:#F7F3EE; --page-muted:#CDBBC7; --frame:rgba(183,131,167,.22);
  --line-rose:#E07890; --line-lime:#B7EF76; --line-mauve:#B783A7;
  --glow-rose:drop-shadow(0 0 5px rgba(236,138,161,.55)); --glow-lime:drop-shadow(0 0 5px rgba(183,239,118,.45));
  /* Style A — Night Glass */
  --a-s1:rgba(55,35,66,.74); --a-s2:rgba(37,23,44,.74); --a-line:rgba(236,138,161,.17); --a-hi:rgba(255,255,255,.07);
  --a-shadow:0 26px 50px -30px rgba(0,0,0,.85);
  --a-glow-rose:rgba(236,138,161,.16); --a-glow-lime:rgba(183,239,118,.13); --a-glow-orange:rgba(255,174,122,.13); --a-glow-mauve:rgba(183,131,167,.16);
  --a-field:rgba(255,255,255,.04);
  /* Style B — Ops Panel */
  --b-s:#24152A; --b-head:rgba(183,131,167,.07); --b-line:rgba(183,131,167,.21); --b-field:#2E1D35;
  --b-rule-rose:#EC8AA1; --b-rule-lime:#B7EF76; --b-rule-orange:#FFAE7A; --b-rule-mauve:#C9A0BD;
  --b-rule-glow:0 0 10px;
}
html[data-theme="light"]{
  --bg:#F7F3EE; --bg-glow1:rgba(198,92,117,.08); --bg-glow2:rgba(255,240,222,.9);
  --side:#1A0F1E; --side-line:rgba(183,131,167,.14);
  --card:#FFFCF9; --card-2:#F7F1EA; --card-3:#FFF0DE;
  --line:#EDE5DB; --line-2:#E2D6C9;
  --text:#1A0F1E; --muted:#5B4B57; --faint:#76646F;
  --accent:#A8476A; --accent-strong:#B34F73;
  --pos:#2D6F3F; --neg:#B0284E; --warn:#B4561F;
  --glass:rgba(247,243,238,.78); --glass-line:#EDE5DB;
  --grid:#EDE5DB;
  --pill-g-bg:#E3F2E6; --pill-g:#21613A;
  --pill-o-bg:#FFEBDA; --pill-o:#A44A16;
  --pill-r-bg:#FBE3E9; --pill-r:#A12D55;
  --pill-n-bg:#EFEAE5; --pill-n:#5F5560;
  --pill-m-bg:#F4E7F0; --pill-m:#7E4471;
  --tint-rose:#FBE6EB; --tint-green:#E1F0E4; --tint-orange:#FFEAD9; --tint-mauve:#F2E6EF; --tint-berry:#F7DDEA;
  --ic-rose:#B34F73; --ic-green:#2D6F3F; --ic-orange:#C0601F; --ic-mauve:#8A5A80; --ic-berry:#A50B5E;
  --row-hover:#FBF6F1;
  --page:#EFE8E0; --page-text:#1A0F1E; --page-muted:#5B4B57; --frame:#E2D6C9;
  --line-rose:#C65C75; --line-lime:#2D6F3F; --line-mauve:#8A5A80;
  --glow-rose:none; --glow-lime:none;
  --a-s1:rgba(255,252,249,.94); --a-s2:rgba(255,249,243,.94); --a-line:#EDE5DB; --a-hi:#fff;
  --a-shadow:0 1px 2px rgba(26,15,30,.04),0 14px 30px -22px rgba(58,35,67,.3);
  --a-glow-rose:rgba(198,92,117,.07); --a-glow-lime:rgba(45,111,63,.07); --a-glow-orange:rgba(232,124,64,.07); --a-glow-mauve:rgba(183,131,167,.08);
  --a-field:#F7F1EA;
  --b-s:#FFFCF9; --b-head:#FBF4EC; --b-line:#E2D6C9; --b-field:#F7F1EA;
  --b-rule-rose:#B34F73; --b-rule-lime:#2D6F3F; --b-rule-orange:#C0601F; --b-rule-mauve:#8A5A80;
  --b-rule-glow:0 0 0;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--page-text);font-family:var(--ui);line-height:var(--lh);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[dir="rtl"] svg.i.flip{transform:scaleX(-1)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}


/* ================= page chrome ================= */
.hd{padding:36px 48px 26px;color:#F7F3EE;background:radial-gradient(800px 380px at 15% -10%, rgba(198,92,117,.28), transparent 60%),radial-gradient(600px 320px at 100% 120%, rgba(88,61,98,.55), transparent 60%),#1A0F1E}
.hd .ey{font-size:12px;color:#B7EF76;font-weight:600;display:flex;gap:10px;align-items:center}
.hd .ey i{width:28px;height:1px;background:#B7EF76;opacity:.6}
.hd h1{font-family:var(--disp);font-size:38px;font-weight:600;line-height:1.3;margin:8px 0 4px}
.hd h1 small{display:block;font-size:15px;color:#EC8AA1;font-weight:500;line-height:1.6}
.hd p{font-size:14.5px;color:#D9C8D3;max-width:900px}
.hd p.alt{font-size:12.5px;color:#A8919F;text-align:end;margin-top:4px}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 48px;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--frame)}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--card-2);border:1px solid var(--frame)}
.seg button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--page-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button small{font-size:10.5px;opacity:.75;font-weight:500}
.seg button.on{background:linear-gradient(135deg,#C65C75,#A9466A);color:#fff;box-shadow:0 6px 16px -6px rgba(198,92,117,.75)}
.seg button svg.i{width:14px;height:14px}
.bar .lbl{font-size:12px;color:var(--page-muted)}
.bar .sp{flex:1}
.cols{padding:24px 48px 64px;display:grid;gap:32px}
.cols.both{grid-template-columns:1fr 1fr;gap:24px}
.col[hidden]{display:none}
.spec{border:1px solid var(--frame);border-radius:16px;padding:22px 24px;background:var(--card);color:var(--text);margin-bottom:20px}
.spec .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--accent);background:var(--tint-rose);padding:2px 10px;border-radius:999px}
.spec h2{font-family:var(--disp);font-size:28px;font-weight:600;line-height:1.4;margin-top:8px}
.spec h2 small{margin-inline:10px;font-size:15px;color:var(--accent);font-weight:500;margin-inline-start:10px}
.spec .rat{font-size:14px;color:var(--muted);margin-top:4px}
.spec .rat.alt{font-size:12px;color:var(--faint);margin-top:2px;line-height:1.6}
.spec dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:16px}
.spec dl div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card-2)}
.spec dt{font-size:12.5px;font-weight:700;color:var(--text)}
.spec dt span{margin-inline:6px;font-size:10.5px;font-weight:500;color:var(--faint);margin-inline-start:6px}
.spec dd{font-size:12.5px;color:var(--muted);margin-top:2px}
.spec dd code{font-family:ui-monospace,Menlo,monospace;font-size:11px;direction:ltr;unicode-bidi:isolate;color:var(--text)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;color:var(--page-text)}
.sec-h b{font-family:var(--disp);font-size:20px;font-weight:700}
.sec-h span{font-size:12.5px;color:var(--page-muted)}
.sec-h .alt{font-size:11.5px}
.stage{position:relative;direction:ltr;overflow:hidden;border-radius:14px;border:1px solid var(--frame);box-shadow:0 30px 80px -40px rgba(0,0,0,.6)}
.board{position:absolute;top:0;left:0;width:1440px;transform-origin:0 0;direction:var(--dir);background:var(--bg);color:var(--text);font-size:13px}

/* ================= shared card internals (style-neutral) ================= */
.kit{padding:32px;background-image:radial-gradient(700px 300px at 10% -60px,var(--bg-glow1),transparent 70%),radial-gradient(600px 260px at 85% -80px,var(--bg-glow2),transparent 70%)}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 20px;margin-bottom:20px}
.kgrid.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kc{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.kc span{margin-inline:2px;font-size:10.5px;font-weight:500;color:var(--faint)}
.s2{grid-column:span 2}.s3{grid-column:span 3}
.cd{position:relative;min-width:0}
.cd-h{display:flex;align-items:center;gap:10px;position:relative}
.cd-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.cd-t h4{font-size:14px;font-weight:600;white-space:nowrap;line-height:1.4}
.cd-sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cd-ic{display:grid;place-items:center;flex:none}
.cnt{font-size:11px;font-weight:600;color:var(--muted);padding:0 8px;height:20px;display:inline-flex;align-items:center;white-space:nowrap}
.cd-a{display:flex;gap:8px;align-items:center}
.lnk{color:var(--accent);font-weight:600;font-size:12px;display:inline-flex;gap:3px;align-items:center;white-space:nowrap;cursor:pointer}
.lnk svg.i{width:13px;height:13px}
.msel{height:28px;padding:0 10px;font-size:12px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line)}
.msel svg.i{width:13px;height:13px;color:var(--muted)}
.t-rose{background:var(--tint-rose);color:var(--ic-rose)} .t-green{background:var(--tint-green);color:var(--ic-green)} .t-orange{background:var(--tint-orange);color:var(--ic-orange)} .t-mauve{background:var(--tint-mauve);color:var(--ic-mauve)} .t-berry{background:var(--tint-berry);color:var(--ic-berry)}
.up{color:var(--pos)} .dn{color:var(--neg)}
/* KPI */
.k-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.k-v{font-family:var(--num);font-weight:700;line-height:1.25;white-space:nowrap}
.k-f{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.dl{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:11.5px;white-space:nowrap}
.dl svg.i{width:11px;height:11px;stroke-width:2.6}
.crit{height:20px;padding:0 8px;border-radius:999px;background:#C65C75;color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center}
/* pills */
.pl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pl.g{background:var(--pill-g-bg);color:var(--pill-g)} .pl.o{background:var(--pill-o-bg);color:var(--pill-o)} .pl.r{background:var(--pill-r-bg);color:var(--pill-r)} .pl.n{background:var(--pill-n-bg);color:var(--pill-n)} .pl.m{background:var(--pill-m-bg);color:var(--pill-m)}
.pl .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pl svg.i{width:12px;height:12px;stroke-width:2.3}
/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{text-align:start;font-size:11.5px;font-weight:600;color:var(--faint);white-space:nowrap;padding:0 10px}
.tbl td{padding:0 10px;white-space:nowrap;vertical-align:middle;border-top:1px solid var(--line)}
.tbl tbody tr:hover td{background:var(--row-hover)}
.tbl th:first-child,.tbl td:first-child{padding-inline-start:16px} .tbl th:last-child,.tbl td:last-child{padding-inline-end:16px}
.tbl .e{text-align:end}
.tbl .mut{color:var(--muted)}
.tbl .b{font-weight:600}
.prod{display:flex;align-items:center;gap:10px}
.prod small{display:block;font-size:11px;color:var(--faint);line-height:1.3}
.prod b{font-weight:600;display:block;line-height:1.35}
.ph{width:34px;height:34px;border-radius:8px;flex:none;position:relative;overflow:hidden}
.ph.sm{width:28px;height:28px;border-radius:7px}
.ph1{background:radial-gradient(circle at 30% 35%,#F6C27A 0 18%,transparent 19%),radial-gradient(circle at 68% 62%,#E59A4B 0 20%,transparent 21%),linear-gradient(135deg,#B9542A,#7A2E18)}
.ph2{background:radial-gradient(ellipse at 50% 55%,#E9C08A 0 34%,transparent 35%),linear-gradient(135deg,#C98A4E,#8A5228)}
.ph3{background:radial-gradient(circle at 35% 40%,#9CC56B 0 18%,transparent 19%),radial-gradient(circle at 66% 60%,#E36B4E 0 16%,transparent 17%),linear-gradient(135deg,#3F6B3A,#25402A)}
.ph4{background:radial-gradient(circle at 40% 45%,#F3D9E1 0 20%,transparent 21%),radial-gradient(circle at 65% 62%,#C65C75 0 16%,transparent 17%),linear-gradient(135deg,#8E4A5E,#5B2A3B)}
.ph5{background:radial-gradient(circle at 50% 50%,#F0DDB8 0 24%,transparent 25%),linear-gradient(135deg,#A47C52,#6A4B2E)}
.ph6{background:repeating-linear-gradient(90deg,#D9A35E 0 6px,#C58A45 6px 12px)}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);display:inline-block;vertical-align:middle}
.cb.on{background:var(--accent-strong);border-color:var(--accent-strong);position:relative}
.cb.on:after{content:"";position:absolute;inset-inline-start:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ab{width:30px;height:30px;display:grid;place-items:center;color:var(--ic-rose);background:var(--tint-rose)}
.ab.del{color:var(--ic-berry);background:var(--tint-berry)}
.ab svg.i{width:15px;height:15px}
.price{display:flex;flex-direction:column;line-height:1.35}
.price b{font-weight:700}
.price small{font-size:11px;color:var(--faint)}
.price small s{color:var(--faint)}
.price small em{font-style:normal;color:var(--pos);font-weight:700}
.avail{width:96px}
.avail .t{font-size:11.5px}
.trk{height:6px;border-radius:4px;background:var(--card-3);overflow:hidden}
html[data-theme="light"] .trk{background:#EDE5DB}
.trk i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2D6F3F,#11A849)}
html[data-theme="dark"] .trk i{background:linear-gradient(90deg,#11A849,#B7EF76)}
.trk i.o{background:linear-gradient(90deg,#E87C40,#F7A46F)}
/* lists */
.li{display:flex;align-items:flex-start;gap:10px;position:relative}
.li .ic{width:30px;height:30px;display:grid;place-items:center;flex:none}
.li .ic svg.i{width:15px;height:15px}
.li .tx{flex:1;min-width:0}
.li .tt{font-size:12.5px;font-weight:600;line-height:1.5}
.li .mm{font-size:11.5px;color:var(--muted);display:block}
.li .mm b{font-weight:700}
.li .tm{font-size:11px;color:var(--faint);white-space:nowrap}
.li .x{color:var(--faint)}
.li .x svg.i{width:13px;height:13px}
/* legends */
.leg{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.leg div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.leg span{color:var(--muted);flex:1;white-space:nowrap}
.leg i{width:9px;height:9px;border-radius:3px;flex:none}
.leg b{font-weight:600}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted)}
.lgd span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lgd i{width:12px;height:3px;border-radius:2px;display:block}
.lgd i.dash{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)!important;color:var(--line-mauve)}
.lgd i.sq{width:9px;height:9px;border-radius:2px}
/* charts — data area stays LTR */
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;overflow:visible}
.ax{font-size:10.5px;fill:var(--faint);font-family:var(--ui)}
.gl{stroke:var(--grid);stroke-dasharray:3 5}
.ln-rose{stroke:var(--line-rose);filter:var(--glow-rose)}
.ln-lime{stroke:var(--line-lime);filter:var(--glow-lime)}
.ln-mauve{stroke:var(--line-mauve)}
.tipw{position:absolute;transform:translate(-50%,calc(-100% - 12px))}
.tip{direction:var(--dir);background:var(--card-3);border:1px solid var(--line-2);padding:6px 10px;font-size:10.5px;color:var(--faint);white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
html[data-theme="light"] .tip{background:#fff}
.tip b{display:block;font-size:13px;color:var(--text);font-weight:700}
.tip em{font-style:normal;color:var(--pos);font-weight:700;margin-inline-start:6px}
.hist div{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.hist .trk{flex:1;height:7px}
.hist b{width:30px;text-align:end;font-weight:600}
.stars{display:flex;gap:2px}
/* toggles & fields */
.tog{position:relative;flex:none;cursor:pointer}
.tog:after{content:"";position:absolute;top:3px;inset-inline-start:3px;background:#fff}
.tog.on:after{inset-inline-start:auto;inset-inline-end:3px}
.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.fi{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;color:var(--text);font-weight:500;border:1px solid var(--line)}
.fi svg.i{width:15px;height:15px;color:var(--muted)}
.fi .chev{margin-inline-start:auto;color:var(--faint)}
.setrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .l{flex:1}
.setrow .l b{display:block;font-size:13px;font-weight:600}
.setrow .l small{display:block;font-size:11.5px;color:var(--muted)}
.setrow .st{font-size:11.5px;font-weight:700;width:30px;text-align:end}
/* sustainability */
.sust{color:#F7F3EE;background:linear-gradient(160deg,#0F4C33 0%,#0C3A28 60%,#0A2E21 100%)}
.sust .cd-t h4{color:#fff}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st4>div{text-align:center;padding:10px 6px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(183,239,118,.26)}
.st4 svg.i{width:17px;height:17px;color:#B7EF76;margin:0 auto 2px}
.st4 b{display:block;font-size:16px;font-weight:700}
.st4 small{display:block;font-size:10.5px;color:#C6E3D0;line-height:1.35;min-height:28px}
.st4 em{display:flex;justify-content:center;gap:3px;align-items:center;font-style:normal;font-size:10.5px;color:#B7EF76;font-weight:600;border-top:1px dashed rgba(183,239,118,.3);margin-top:6px;padding-top:4px}
.st4 em svg.i{width:11px;height:11px;margin:0}
.sust-ft{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(183,239,118,.2);font-size:12px;color:#C6E3D0}
.sust-ft b{color:#B7EF76;font-size:16px;font-weight:700}
.sust-ft a{margin-inline-start:auto;color:#fff;font-weight:600;display:flex;align-items:center;gap:4px}
.sust-ft a svg.i{width:13px;height:13px}
/* ops */
.ops{display:flex;align-items:center;gap:12px;padding:12px;background:linear-gradient(135deg,rgba(17,168,73,.18),rgba(12,67,46,.2));border:1px solid rgba(17,168,73,.35)}
html[data-theme="light"] .ops{background:#E7F3EA;border-color:#C6E2CD}
.ops .oi{width:38px;height:38px;background:#0C432E;color:#B7EF76;display:grid;place-items:center;flex:none}
.ops b{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.ops b i{width:8px;height:8px;border-radius:50%;background:#11A849;box-shadow:0 0 0 4px rgba(17,168,73,.25)}
.ops small{font-size:12px;color:var(--muted)}
.ophr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ophr div small{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--faint)}
.ophr div small svg.i{width:12px;height:12px}
.ophr div b{font-size:13.5px;font-weight:700}
.opbtn{margin-top:12px;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;border:1px dashed var(--line-2);color:var(--text)}
.opbtn svg.i{width:14px;height:14px}
/* banner */
.banner{display:flex;align-items:center;gap:16px;padding:18px 24px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(var(--g-ban),#A9466A 0%,#C65C75 35%,#5A1F45 78%,#3A2343 100%);border:1px solid rgba(236,138,161,.35)}
html[data-theme="light"] .banner{background:linear-gradient(var(--g-ban),#B34F73 0%,#C65C75 38%,#8E2E5C 100%);border:0}
.banner .wb{width:44px;height:44px;background:#FFFCF9;color:#B34F73;font-family:var(--wm);font-weight:600;font-size:18px;display:grid;place-items:center;flex:none;direction:ltr}
.banner h3{font-family:var(--disp);font-size:21px;font-weight:700;line-height:1.4}
.banner p{font-size:12.5px;opacity:.92}
.banner .bb{margin-inline-start:auto;height:42px;padding:0 18px;background:#FFFCF9;color:#A9466A;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;position:relative;z-index:1}
.banner .bb svg.i{width:15px;height:15px}
.bags{width:190px;height:64px;position:relative;flex:none;margin-block:-18px;align-self:flex-end}
.bags i{position:absolute;bottom:0;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#E9C48E,#B8823F)}
.bags i:nth-child(1){inset-inline-start:10px;width:58px;height:52px}
.bags i:nth-child(2){inset-inline-start:58px;width:66px;height:40px;background:linear-gradient(180deg,#F3DDB8,#C9A16A)}
.bags i:nth-child(3){inset-inline-start:118px;width:38px;height:58px;background:linear-gradient(180deg,#FFFCF9,#E6DCCF)}
.bags i:nth-child(4){inset-inline-start:150px;width:32px;height:36px;border-radius:50% 50% 6px 6px;background:linear-gradient(180deg,#F6E7D3,#D2B48D)}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.qrow:first-child{border-top:0}
.qrow .nm{flex:1;font-weight:500;white-space:nowrap}
.qrow svg.sp{width:64px;height:22px}

/* ================= app shell (RTL) ================= */
.app{display:flex;min-height:1000px}
.side{width:256px;flex:none;background:var(--side);color:#F7F3EE;padding:24px 16px 22px;display:flex;flex-direction:column;border-inline-start:1px solid var(--side-line);
  background-image:radial-gradient(260px 220px at var(--s-x) 0%, rgba(198,92,117,.12), transparent 70%),radial-gradient(300px 300px at var(--e-x) 100%, rgba(88,61,98,.35), transparent 70%)}
.logo{padding:0 10px 14px;text-align:start}
.logo .wm{font-family:var(--wm);font-size:28px;font-weight:500;line-height:1;color:#F7F3EE}
.logo .tag{font-size:10.5px;font-weight:600;color:#EC8AA1;margin-top:6px}
html[lang="en"] .logo .tag{font-size:7.5px;letter-spacing:.24em;font-weight:700;margin-top:8px}
.role{display:flex;align-items:center;gap:7px;padding:10px 10px 14px;border-bottom:1px solid var(--side-line);margin-bottom:10px;font-weight:600;font-size:14px}
.vt{width:15px;height:15px;border-radius:50%;background:#11A849;display:inline-grid;place-items:center;box-shadow:0 0 8px rgba(17,168,73,.6)}
.vt svg.i{width:9px;height:9px;stroke:#fff;stroke-width:3.4}
.mid{display:flex;align-items:center;gap:10px;padding:10px 8px 14px;border-bottom:1px solid var(--side-line);margin-bottom:10px}
.mlogo{width:38px;height:38px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#FFD58A,#E8A13A 55%,#B9681C);box-shadow:0 0 0 2px #1A0F1E,0 0 0 3px rgba(255,213,138,.5)}
.mid .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mid .br{font-size:11.5px;color:#BFA9B8}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:11px;height:36px;padding:0 12px;border-radius:10px;color:#CDBBC7;font-size:13.5px;font-weight:500;white-space:nowrap;cursor:pointer}
.nav a svg.i{width:17px;height:17px;color:#A8919F}
.nav a:hover{background:rgba(183,131,167,.1);color:#fff}
.nav a.on{background:linear-gradient(var(--g-act),#C65C75 0%,#A9466A 100%);color:#fff;box-shadow:0 8px 22px -8px rgba(198,92,117,.75),inset 0 1px 0 rgba(255,255,255,.18)}
.nav a.on svg.i{color:#fff}
.nav a .bd{margin-inline-start:auto;font-size:10.5px;font-weight:700;background:#C65C75;color:#fff;border-radius:99px;padding:0 7px}
.impact{margin-top:18px;border-radius:12px;padding:10px 12px;background:linear-gradient(160deg,#0F4C33,#0C3A28);border:1px solid rgba(183,239,118,.22);box-shadow:0 0 24px -10px rgba(183,239,118,.4)}
.impact h5{font-size:11px;font-weight:600;color:#B7EF76;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.impact h5 svg.i{width:12px;height:12px}
.impact .row{display:flex;justify-content:space-between}
.impact b{display:block;font-size:14px;font-weight:700;color:#fff}
.impact small{font-size:10.5px;color:#9FCBB0}
.ucard{margin-top:10px;border-radius:12px;padding:10px;border:1px solid var(--side-line);background:rgba(255,255,255,.03);display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:linear-gradient(140deg,#E9B8A6,#8C5A4A);position:relative;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.av:before{content:"";position:absolute;inset-inline-start:30%;top:16%;width:40%;height:40%;border-radius:50%;background:#F3D3C2}
.av:after{content:"";position:absolute;inset-inline-end:-1px;bottom:0;width:9px;height:9px;border-radius:50%;background:#11A849;border:2px solid var(--side)}
.ucard b{font-size:13px;font-weight:600;display:block}
.ucard small{font-size:11px;color:#BFA9B8}
.ucard .chev{margin-inline-start:auto;color:#BFA9B8}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background-image:radial-gradient(700px 300px at 8% -60px,var(--bg-glow1),transparent 70%),radial-gradient(600px 260px at 80% -80px,var(--bg-glow2),transparent 70%)}
.top{display:flex;align-items:center;gap:10px;padding:18px 32px 16px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--glass-line)}
.top h1{font-family:var(--disp);font-size:28px;font-weight:600;line-height:1.35;display:flex;align-items:center;gap:8px;white-space:nowrap}
.top h1 svg.i{width:24px;height:24px;color:#F2B04A}
.top p{font-size:12.5px;color:var(--muted);white-space:nowrap}
.top .sp{flex:1}
.ctl{height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
.ctl [dir="rtl"] svg.i.flip{transform:scaleX(-1)}
svg.i{width:16px;height:16px;color:var(--muted)}
.ctl.search{width:250px;color:var(--faint);font-weight:400;overflow:hidden}
.ctl.ico{width:40px;padding:0;justify-content:center;position:relative}
.ctl .badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;border-radius:9px;background:#C65C75;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.avm{display:flex;align-items:center;gap:4px;color:var(--muted)}
.content{padding:22px 32px 36px;display:flex;flex-direction:column;gap:16px}
.row{display:grid;gap:16px}

/* ================================================================
   STYLE A — زجاج الليل · Night Glass
   ================================================================ */
.sA .cd{background:linear-gradient(180deg,var(--a-s1),var(--a-s2));backdrop-filter:blur(14px) saturate(1.15);border:1px solid var(--a-line);border-radius:16px;box-shadow:inset 0 1px 0 var(--a-hi),var(--a-shadow);overflow:hidden;--gc:var(--a-glow-rose)}
.sA .cd:before{content:"";position:absolute;top:-70px;inset-inline-start:-70px;width:260px;height:180px;background:radial-gradient(closest-side,var(--gc),transparent);pointer-events:none}
.sA .cd.tone-lime{--gc:var(--a-glow-lime)} .sA .cd.tone-orange{--gc:var(--a-glow-orange)} .sA .cd.tone-mauve{--gc:var(--a-glow-mauve)}
.sA .cd-h{padding:16px 18px 6px}
.sA .cd-b{padding:10px 18px 18px;position:relative}
.sA .cd-b.flush{padding:6px 0 6px}
.sA .cd-ic{width:28px;height:28px;border-radius:9px}
.sA .cd-ic svg.i{width:15px;height:15px}
.sA .cnt{border-radius:999px;background:rgba(183,131,167,.12)}
html[data-theme="light"] .sA .cnt{background:#F2E9EF}
.sA .msel{border-radius:999px;background:var(--a-field)}
.sA .kpi .cd-b{padding:16px 18px 0}
.sA .k-top .cd-ic{width:30px;height:30px}
.sA .k-v{font-size:28px;margin-top:10px}
.sA .k-f{margin-top:4px}
.sA .k-sp{display:block;width:calc(100% + 36px);margin-inline:-18px;height:40px;margin-top:8px}
.sA .dl{padding:0 7px;height:20px;border-radius:999px}
.sA .dl.up{background:var(--pill-g-bg)} .sA .dl.dn{background:var(--pill-r-bg)}
.sA .pl{height:24px;padding:0 10px;border-radius:999px}
.sA .pl svg.i{display:none}
html[data-theme="dark"] .sA .pl .dot{box-shadow:0 0 6px currentColor}
.sA .tbl th{height:38px;border-bottom:1px solid var(--line)}
.sA .tbl tbody tr:first-child td{border-top:0}
.sA .tbl td{height:52px;border-top-color:rgba(183,131,167,.1)}
html[data-theme="light"] .sA .tbl td{border-top-color:#F1EAE2}
.sA .ab{border-radius:10px}
.sA .li{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(183,131,167,.1);margin-bottom:8px}
html[data-theme="light"] .sA .li{background:#FBF6F1;border-color:#F0E7DE}
.sA .li.hot{border-color:rgba(236,138,161,.4);background:linear-gradient(var(--g-start),rgba(198,92,117,.18),rgba(255,255,255,.03) 75%)}
html[data-theme="light"] .sA .li.hot{background:linear-gradient(var(--g-start),#FBE3E9,#FBF6F1 75%);border-color:#F3C6D2}
.sA .li .ic{border-radius:10px}
.sA .tip{border-radius:10px}
.sA .tog{width:42px;height:24px;border-radius:999px;background:var(--card-3);border:1px solid var(--line-2)}
.sA .tog:after{width:16px;height:16px;border-radius:50%;background:var(--faint)}
.sA .tog.on{background:linear-gradient(var(--g-act),#C65C75,#A9466A);border-color:transparent}
html[data-theme="dark"] .sA .tog.on{box-shadow:0 0 14px -3px rgba(198,92,117,.85)}
.sA .tog.on:after{background:#fff}
.sA .fi{border-radius:11px;background:var(--a-field)}
.sA .fi.focus{border-color:#C65C75;box-shadow:0 0 0 4px rgba(198,92,117,.18)}
.sA .sust{border:1px solid rgba(183,239,118,.24);box-shadow:0 0 44px -18px rgba(183,239,118,.55);background:linear-gradient(160deg,rgba(15,76,51,.92),rgba(10,46,33,.92));--gc:rgba(183,239,118,.16)}
.sA .st4>div{border-radius:12px}
.sA .ops{border-radius:12px} .sA .ops .oi{border-radius:11px}
.sA .opbtn{border-radius:11px}
.sA .banner{border-radius:18px;box-shadow:0 20px 50px -25px rgba(198,92,117,.9)}
.sA .banner .wb{border-radius:12px} .sA .banner .bb{border-radius:12px}
.sA .tbl-wrap{padding:0}

/* ================================================================
   STYLE B — لوحة التشغيل · Ops Panel
   ================================================================ */
.sB .cd{background:var(--b-s);border:1px solid var(--b-line);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 12px 28px -22px rgba(0,0,0,.8);--rc:var(--b-rule-rose)}
.sB .cd:before{content:"";position:absolute;top:-1px;inset-inline-start:14px;width:56px;height:2px;border-radius:0 0 2px 2px;background:var(--rc);box-shadow:var(--b-rule-glow) var(--rc);z-index:1}
.sB .cd.tone-lime{--rc:var(--b-rule-lime)} .sB .cd.tone-orange{--rc:var(--b-rule-orange)} .sB .cd.tone-mauve{--rc:var(--b-rule-mauve)}
.sB .cd-h{height:44px;padding:0 14px;background:var(--b-head);border-bottom:1px solid var(--b-line);border-radius:8px 8px 0 0}
.sB .cd-t h4{font-size:13.5px}
.sB .cd-b{padding:12px 14px 14px;position:relative}
.sB .cd-b.flush{padding:0}
.sB .cd-ic{width:18px;height:18px;background:none!important}
.sB .cd-ic [dir="rtl"] svg.i.flip{transform:scaleX(-1)}
svg.i{width:16px;height:16px}
.sB .cnt{border-radius:5px;border:1px solid var(--b-line);background:var(--b-s)}
.sB .msel{border-radius:6px;background:var(--b-field);height:26px}
.sB .kpi .cd-h{height:38px}
.sB .kpi .cd-b{padding:10px 14px 12px}
.sB .kpi{overflow:hidden}
.sB .k-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.sB .k-row>div{flex:none}
.sB .k-v{font-size:25px}
.sB .k-sp{flex:1 1 auto;min-width:0;max-width:110px;height:30px;margin-bottom:4px}
.sB .k-f{margin-top:4px;padding-top:8px;border-top:1px dashed var(--b-line)}
.sB .dl{padding:0}
.sB .pl{height:22px;padding:0 7px 0 8px;border-radius:5px;border:1px solid color-mix(in srgb,currentColor 38%,transparent)}
.sB .pl .dot{display:none}
.sB .tbl th{height:34px;background:var(--b-head);border-bottom:1px solid var(--b-line);font-size:11.5px}
.sB .tbl tbody tr:first-child td{border-top:0}
.sB .tbl td{height:44px;border-top-color:var(--b-line)}
.sB .tbl td+td,.sB .tbl th+th{border-inline-start:1px solid color-mix(in srgb,var(--b-line) 55%,transparent)}
.sB .ab{border-radius:6px;width:28px;height:28px;background:transparent;border:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.sB .li{padding:10px 14px;border-top:1px solid var(--b-line)}
.sB .li:first-child{border-top:0}
.sB .li.hot{box-shadow:inset var(--sx) 0 0 var(--b-rule-rose);background:linear-gradient(var(--g-start),rgba(198,92,117,.12),transparent 60%)}
html[data-theme="light"] .sB .li.hot{background:linear-gradient(var(--g-start),#FCEBEF,transparent 60%)}
.sB .li .ic{border-radius:6px;width:28px;height:28px}
.sB .tip{border-radius:5px}
.sB .tog{width:38px;height:22px;border-radius:5px;background:var(--b-field);border:1px solid var(--line-2)}
.sB .tog:after{width:14px;height:14px;border-radius:3px;background:var(--faint)}
.sB .tog.on{background:var(--g-mid);border-color:var(--g-mid)}
html[data-theme="dark"] .sB .tog.on{background:#1C6B3B;border-color:#3FA164;box-shadow:0 0 10px -2px rgba(183,239,118,.55)}
.sB .tog.on:after{background:#fff}
.sB .fi{border-radius:6px;background:var(--b-field);border-color:var(--b-line);height:38px}
.sB .fi.focus{border-color:#EC8AA1;box-shadow:inset 0 0 0 1px #EC8AA1}
html[data-theme="light"] .sB .fi.focus{border-color:#B34F73;box-shadow:inset 0 0 0 1px #B34F73}
.sB .cd.sust{border-radius:8px;border:1px solid rgba(183,239,118,.3);--rc:#B7EF76;background:linear-gradient(160deg,#0F4C33 0%,#0C3A28 60%,#0A2E21 100%)}
.sB .sust .cd-h{background:rgba(0,0,0,.16);border-bottom-color:rgba(183,239,118,.22)}
.sB .st4>div{border-radius:6px}
.sB .ops{border-radius:6px} .sB .ops .oi{border-radius:6px}
.sB .opbtn{border-radius:6px;border-style:solid;background:var(--b-field)}
.sB .banner{border-radius:8px}
.sB .banner .wb{border-radius:6px} .sB .banner .bb{border-radius:6px}
.sB .banner:before{content:"";position:absolute;top:0;inset-inline-start:24px;width:72px;height:2px;background:#FFF0DE;box-shadow:0 0 10px rgba(255,240,222,.8)}
.sB .qrow{padding:8px 14px}

/* ================= chart motion (charts only) ================= */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gw{from{width:0}}
.anim .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.3,.7,.3,1) forwards}
.anim .sweep{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s cubic-bezier(.3,.7,.3,1) forwards}
.anim .afill{animation:fade .9s .35s ease-out both}
.anim .grow{transform-box:fill-box;transform-origin:50% 100%;animation:gy .8s cubic-bezier(.3,.7,.3,1) both}
.anim .gw{animation:gw .9s cubic-bezier(.3,.7,.3,1) both}
.anim .tipw{animation:fade .4s 1s both}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}.anim .draw,.anim .sweep{stroke-dasharray:none!important;stroke-dashoffset:0!important}}

/* ================================================================
   ART-DIRECTOR REFINEMENTS (html.ref)
   1) Table status badges carry an icon (from Ops Panel)
   2) Glow hierarchy: hero glow only on Priority Alerts + Sustainability
      Impact; every other card glows softly (from Folio)
   ================================================================ */
html.ref .sA .tbl .pl .dot{display:none}

function smooth(p){let d=`M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${(b[1]+(c[1]-a[1])/6).toFixed(1)},${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${(c[1]-(e[1]-b[1])/6).toFixed(1)},${c[0].toFixed(1)} ${c[1].toFixed(1)}`}return d}
const scl=(v,w,h,mn,mx,l,tp)=>v.map((x,i)=>[l+i*(w/(v.length-1)),tp+h-((x-mn)/(mx-mn))*h]);
function spark(vals,cls='ln-lime'){const W=120,H=36,p=scl(vals,W,H-8,Math.min(...vals),Math.max(...vals),0,4);const d=smooth(p);const id='sg'+(++UID);
  return `<svg class="k-sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><g style="color:${cls==='ln-lime'?'var(--line-lime)':'var(--line-rose)'}"><path class="afill" d="${d} L${W} ${H} L0 ${H}Z" fill="url(#${id})"/><path class="draw ${cls}" pathLength="1" d="${d}" fill="none" stroke-width="1.8" vector-effect="non-scaling-stroke"/></g></svg>`}
function areaChart({vals,W=560,H=240,min=0,max,ticks,yfmt=v=>v,xl,tipI,tip,cls='ln-rose'}){
  const Lx=38,T=10,w=W-Lx-6,h=H-T-26,p=scl(vals,w,h,min,max,Lx,T);const d=smooth(p);const id='ag'+(++UID);
  const g=ticks.map(v=>{const y=T+h-((v-min)/(max-min))*h;return `<line class="gl" x1="${Lx}" x2="${W-6}" y1="${y}" y2="${y}"/><text class="ax" x="${Lx-8}" y="${y+3.5}" text-anchor="end">${yfmt(v)}</text>`}).join('');
  const xs=xl.map((s,i)=>s?`<text class="ax" x="${Lx+i*(w/(xl.length-1))}" y="${H-6}" text-anchor="${i===0?'start':i===xl.length-1?'end':'middle'}">${s}</text>`:'').join('');
  const col=cls==='ln-lime'?'var(--line-lime)':'var(--line-rose)';const tp=tipI!=null?p[tipI]:null;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${g}${xs}<path class="afill" d="${d} L${p[p.length-1][0]} ${T+h} L${Lx} ${T+h}Z" fill="url(#${id})"/><path class="draw ${cls}" pathLength="1" d="${d}" fill="none" stroke-width="2.2"/>${tp?`<line x1="${tp[0]}" x2="${tp[0]}" y1="${tp[1]}" y2="${T+h}" stroke="${col}" stroke-dasharray="2 3" class="afill"/><circle class="afill" cx="${tp[0]}" cy="${tp[1]}" r="4.5" fill="var(--bg)" stroke="${col}" stroke-width="2.2"/>`:''}</svg>${tp?`<div class="tipw" style="inset-inline-start:${tp[0]/W*100}%;top:${tp[1]/H*100}%"><div class="tip">${tip}</div></div>`:''}</div>`;
}
function donut(segs,size,stroke,center){const r=(size-stroke)/2,c=size/2,id='dm'+(++UID);let off=0;
  const arcs=segs.map(s=>{const a=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${stroke}" pathLength="100" stroke-dasharray="${Math.max(s.v-.8,0)} 100" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"/>`;off+=s.v;return a}).join('');
  return `<div class="chart" style="width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><mask id="${id}"><circle class="sweep" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#fff" stroke-width="${stroke+4}" pathLength="100" transform="rotate(-90 ${c} ${c})"/></mask></defs><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--card-3)" stroke-width="${stroke}"/><g mask="url(#${id})">${arcs}</g></svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;direction:var(--dir)">${center}</div></div>`}
function barChart(){const months=['Feb','Mar','Apr','May','Jun','Jul'],s=[[150,168,160,182,190,211],[60,72,68,80,86,96],[90,100,94,110,118,126]],col=['var(--line-rose)','#B783A7','var(--line-lime)'];

  const g=[0,50,100,150,200,250].map(v=>{const y=T+h-(v/250)*h;return `<line class="gl" x1="${Lx}" x2="${W-6}" y1="${y}" y2="${y}"/><text class="ax" x="${Lx-8}" y="${y+3.5}" text-anchor="end">${v}K</text>`}).join('');
  const bars=months.map((m,i)=>{const x=Lx+i*bw+bw/2-22;return s.map((ser,j)=>{const hh=ser[i]/250*h;return `<rect class="grow" style="animation-delay:${(i*60+j*30)}ms" x="${x+j*15}" y="${T+h-hh}" width="13" height="${hh}" rx="2.5" fill="${col[j]}"/>`}).join('')+`<text class="ax" x="${Lx+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${t(m)}</text>`}).join('');

  document.getElementById('hd').innerHTML=`<div class="ey"><i></i>${(state.lang==='ar'?t('Phase 2 · Designer 2 · Midnight Plum (EN / Arabic RTL)'):'Art director’s pick · Midnight Plum (EN / Arabic RTL)')}</div><h1>${state.lang==='ar'?t('Two card styles with operational clarity'):'Night Glass cards'}<small ${altAttr()}>${state.lang==='ar'?'Night Glass cards':AR['Two card styles with operational clarity']}</small></h1>
   <p>${state.lang==='ar'?AR.INTRO:'The chosen card style for the Midnight Plum portals, replacing Concept 4’s card design without changing any function, section or field. Cards are fully static: the glow is fixed light, and only charts animate, once on load or on a language switch. All UI text meets WCAG AA in Night and Day.'}</p>`;
  const mb=document.querySelectorAll('#modeSeg button');[['Style A','Style A'],['Style B','Style B'],['Side by side','Side by side']].forEach(([k],i)=>mb[i].innerHTML=`${t(k)}${state.lang==='ar'?` <small lang="en">${k}</small>`:''}`);
  const th=document.querySelectorAll('#themeSeg button');th[0].innerHTML=ic('moon')+t('Night');th[1].innerHTML=ic('sun')+t('Day');
  document.getElementById('lblTheme').textContent=t('Appearance');document.getElementById('lblLang').textContent=t('Language');
}

/* ================= mount / controls ================= */
const colA=document.getElementById('colA'),colB=document.getElementById('colB'),cols=document.getElementById('cols');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){document.querySelectorAll('.col:not([hidden]) .stage').forEach(st=>{const b=st.firstElementChild;const s=st.clientWidth/1440;b.style.transform=`scale(${s})`;st.style.height=(b.offsetHeight*s)+'px'})}
function animate(){document.querySelectorAll('.board').forEach(b=>b.classList.remove('anim'));if(reduce)return;void document.body.offsetWidth;document.querySelectorAll('.col:not([hidden]) .board').forEach(b=>b.classList.add('anim'))}
function render(){
  const h=document.documentElement;h.lang=state.lang;h.dir=state.lang==='ar'?'rtl':'ltr';
  document.title=state.lang==='ar'?'WonderBites — أنماط البطاقات (المصمم 2) · Midnight Plum':'WonderBites — Card styles (Designer 2) · Midnight Plum';
  UID=0;chrome();colA.innerHTML=column('A');colB.innerHTML=column('B');
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===state.lang));
  setMode(state.mode);
}
function setMode(m){state.mode=m;colA.hidden=m==='B';colB.hidden=m==='A';cols.classList.toggle('both',m==='both');document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));fit();animate()}
function setLang(l){if(l===state.lang&&colA.innerHTML)return;state.lang=l;render();if(document.fonts)document.fonts.ready.then(fit)}
document.getElementById('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.mode)});
document.getElementById('langSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.lang)});
document.getElementById('themeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.theme=b.dataset.theme;document.documentElement.dataset.theme=state.theme;document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('on',x===b))});
document.addEventListener('click',e=>{const tg=e.target.closest('.tog');if(tg){tg.classList.toggle('on');const on=tg.classList.contains('on');tg.setAttribute('aria-checked',on);const s=tg.previousElementSibling;if(s){s.textContent=t(on?'On':'Off');s.className='st '+(on?'up':'');s.style.color=on?'':'var(--faint)'}}});
window.addEventListener('resize',fit);
/* optional hash: #en / #ar and #A / #B / #both, e.g. #ar-both */
const hp=location.hash.slice(1).split(/[-,&]/);
if(hp.includes('ar'))state.lang='ar';
const hm=hp.find(x=>['A','B','both'].includes(x));state.mode='A';
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
</script>
<style>#modeSeg{display:none!important}#colB{display:none!important}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{try{setMode('A')}catch(e){}});</script>
<script>
(function(){
  const AR={'Version':'النسخة','Designer’s original':'نسخة المصمم','With art-director refinements':'مع تحسينات المدير الفني'};
  const root=document.documentElement; root.classList.add('ref');
  const seg=document.getElementById('refSeg'), lbl=document.getElementById('lblRef');
  const en={lbl:'Version',b:['Designer’s original','With art-director refinements']};
  function label(){const ar=root.lang==='ar'; lbl.textContent=ar?AR[en.lbl]:en.lbl; seg.querySelectorAll('button').forEach((b,i)=>b.textContent=ar?AR[en.b[i]]:en.b[i]);}
  seg.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; root.classList.toggle('ref',b.dataset.ref==='1'); seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  new MutationObserver(label).observe(root,{attributes:true,attributeFilter:['lang']}); label();
})();
</script>
